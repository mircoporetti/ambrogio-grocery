name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - pubspec.lock
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mircoporetti/ambrogio-web
  NAMESPACE: ambrogio

jobs:
  test:
    name: Test app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter test --platform chrome test/web

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
      - run: flutter pub get
      - run: deploy/build.sh "${GITHUB_SHA}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/mobile
          file: apps/mobile/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    needs: build
    runs-on: [self-hosted, linux, ambrogio]
    environment: Production
    env:
      KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
    steps:
      - name: Check kubeconfig is available
        run: |
          if [ -z "${KUBECONFIG:-}" ] || [ ! -r "$KUBECONFIG" ]; then
            echo "::error::Runner cannot read the kubeconfig (variable KUBECONFIG_PATH in the Production environment)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/mobile/k8s

      - name: Apply manifests with the new image
        working-directory: apps/mobile/k8s
        run: |
          set -euo pipefail
          sed -i "s/newTag: latest/newTag: ${GITHUB_SHA}/" kustomization.yaml
          kubectl apply -k .
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=5m

      - name: Report running pods
        if: always()
        run: kubectl -n "$NAMESPACE" get pods -o wide
