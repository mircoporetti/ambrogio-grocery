name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - packages/**
      - pubspec.lock
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mircoporetti/ambrogio-backend
  NAMESPACE: ambrogio

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: docker compose up --detach --wait
      - run: dart test

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    needs: build
    runs-on: [self-hosted, linux, ambrogio]
    environment: Production
    env:
      KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
    steps:
      - name: Check kubeconfig is available
        run: |
          if [ -z "${KUBECONFIG:-}" ]; then
            echo "::error::Variable KUBECONFIG_PATH is not set in the Production environment"
            exit 1
          fi
          if [ ! -r "$KUBECONFIG" ]; then
            echo "::error::Runner cannot read kubeconfig at $KUBECONFIG"
            exit 1
          fi
          if ! kubectl -n "$NAMESPACE" get secret ambrogio-secrets >/dev/null; then
            echo "::error::Secret ambrogio-secrets is missing in namespace $NAMESPACE (see apps/backend/k8s/README.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/backend/k8s

      - name: Apply manifests with the new image
        working-directory: apps/backend/k8s
        run: |
          set -euo pipefail
          sed -i "s/newTag: latest/newTag: ${GITHUB_SHA}/" kustomization.yaml
          kubectl apply -k .
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=5m

      - name: Report running pods
        if: always()
        run: kubectl -n "$NAMESPACE" get pods -o wide
